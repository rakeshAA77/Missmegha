
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Birthday Tanisha 🎂</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ffefba 0%, #ffffff 100%);
      overflow: hidden;
    }
    h1 {
      text-align: center;
      font-size: 3em;
      margin: 20px 0;
      animation: pulse 2s infinite;
      color: #d63384;
      text-shadow: 3px 3px #ffc0cb;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .wheel-container {
      position: relative;
      width: 350px;
      height: 350px;
      margin: 0 auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      border-radius: 50%;
      background: #fff;
    }
    #wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      transition: transform 5s cubic-bezier(0.33, 1, 0.68, 1);
      overflow: hidden;
    }
    .slice {
      position: absolute;
      width: 50%;
      height: 50%;
      top: 50%;
      left: 50%;
      transform-origin: 0 0;
      clip-path: polygon(0 0, 100% 0, 0 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 0.9em;
      padding: 8px;
      font-weight: bold;
      color: #444;
      text-shadow: 1px 1px rgba(255,255,255,0.7);
    }
    #spinBtn {
      display: block;
      margin: 30px auto;
      padding: 15px 30px;
      background-color: #d63384;
      color: #fff;
      border: none;
      border-radius: 25px;
      font-size: 1.1em;
      cursor: pointer;
      box-shadow: 0 5px #b02a6a;
      transition: background 0.3s;
    }
    #spinBtn:hover {
      background-color: #b02a6a;
    }
    #spinBtn:active {
      box-shadow: none;
      transform: translateY(5px);
    }
    .pointer {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; 
      height: 0; 
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 30px solid #d63384;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
    }
    #message {
      text-align: center;
      font-size: 1.4em;
      margin-top: 20px;
      color: #d63384;
    }
    .confetti {
      position: fixed;
      width: 12px;
      height: 12px;
      top: -10px;
      animation: fall linear infinite;
      z-index: 0;
    }
    .confetti:before {
      content: '🎊';
      display: block;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>Happy Birthday Tanisha 🎂</h1>
  <div class="wheel-container">
    <div class="pointer"></div>
    <div id="wheel"></div>
  </div>
  <button id="spinBtn">Spin the Wheel 🎡</button>
  <div id="message"></div>
  <script>
    const options = [
      "Big Hug 🤗",
      "You're Amazing 🎈",
      "Keep Smiling 😁",
      "Best Wishes 🎉",
      "Surprise Gift 🎁",
      "Dance Now 💃",
      "Make a Wish ✨",
      "Call Me 📞"
    ];
    const colors = [
      "#ffe6f0", "#ffdbe6", "#ffccf9", "#e0bbff",
      "#c2f0fc", "#b3e5fc", "#d0f8ce", "#fff3cd"
    ];
    const wheel = document.getElementById('wheel');
    const message = document.getElementById('message');
    const spinBtn = document.getElementById('spinBtn');
    let deg = 0;
    function createWheel() {
      options.forEach((text, i) => {
        const slice = document.createElement('div');
        slice.className = 'slice';
        slice.style.transform = 'rotate(' + (i * 45) + 'deg)';
        slice.style.background = colors[i];
        slice.innerHTML = '<div style="transform: rotate(-' + (i * 45) + 'deg)">' + text + '</div>';
        wheel.appendChild(slice);
      });
    }
    createWheel();
    spinBtn.addEventListener('click', () => {
      spinBtn.disabled = true;
      const rand = Math.floor(Math.random() * 360 + 1440);
      deg += rand;
      wheel.style.transform = 'rotate(' + deg + 'deg)';
      setTimeout(() => {
        const normalized = deg % 360;
        const index = Math.floor(((360 - normalized + 22.5) % 360) / 45);
        message.textContent = options[index];
        spinBtn.disabled = false;
      }, 5200);
    });
    for (let i = 0; i < 80; i++) {
      const conf = document.createElement("div");
      conf.className = "confetti";
      conf.style.left = Math.random() * 100 + "vw";
      conf.style.animationDuration = (3 + Math.random() * 2) + "s";
      conf.style.fontSize = (10 + Math.random()*10) + "px";
      document.body.appendChild(conf);
    }
  </script>
</body>
</html>
